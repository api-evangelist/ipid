aid: ipid
name: Ipid
description: >-
  iPiD (International Payments Identity) is a fintech providing real-time Know Your Payee (KYP)
  verification for cross-border and domestic payments. Its single, payment-rail-agnostic API lets
  banks, PSPs, and corporates validate bank account ownership and match payee names before funds
  move, reducing authorized push payment (APP) fraud, business email compromise losses, and failed
  transactions. Products include iPiD Validate (global payee / bank account verification with
  name-matching), iPiD Node (a scheme-compliance layer for EU Verification of Payee, UK Confirmation
  of Payee, FATF Recommendation 16, and US Nacha), and a Payment Agent agentic verification layer.
  Founded in 2021, iPiD is backed by QED Investors, Monk's Hill Ventures, Quona Capital, Jungle
  Ventures, Saison Capital, and others. Public API access is gated behind a sales/demo process; no
  machine-readable specification is published publicly.
